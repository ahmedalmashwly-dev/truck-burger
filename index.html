<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truck Burger - المنيو والطلبات</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; margin: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
    input, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    button { background: #ffb703; color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
    button:hover { background: #e0a100; }
    .order-item { background: #252525; border-right: 4px solid #ffb703; padding: 15px; margin-bottom: 12px; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Truck Burger 🍔</h1>

  <!-- قسم الزبون -->
  <div id="customer-section" class="card">
    <h2>طلب جديد</h2>
    <form id="order-form">
      <label>الوجبة المطلوبة:</label>
      <input type="text" id="order-item-name" placeholder="مثال: برجر لحم دبل" required>
      <label>اسمك:</label>
      <input type="text" id="customer-name" placeholder="اسمك الكامل" required>
      <label>رقم الجوال:</label>
      <input type="tel" id="customer-phone" placeholder="77XXXXXXXX" required>
      <button type="submit">إرسال الطلب</button>
    </form>
  </div>

  <!-- قسم المالك (#admin) -->
  <div id="admin-orders-section" class="card" style="display: none;">
    <h2>📥 الطلبات الواردة (تحديث فوري)</h2>
    <div id="orders-list">جاري تحميل الطلبات...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBGCoYbgBZ4aRihP29_n",
    authDomain: "truck-burger-3d190.firebaseapp.com",
    projectId: "truck-burger-3d190",
    storageBucket: "truck-burger-3d190.appspot.com",
    messagingSenderId: "184670564449",
    appId: "1:184670564449:web:1cf68b2b9c2a4b9416ba20"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const ordersCollection = collection(db, "orders");

  const isAdmin = window.location.hash === "#admin";
  if (isAdmin) {
    document.getElementById("admin-orders-section").style.display = "block";
  }

  document.getElementById("order-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await addDoc(ordersCollection, {
        item: document.getElementById("order-item-name").value,
        customer: document.getElementById("customer-name").value,
        phone: document.getElementById("customer-phone").value,
        createdAt: new Date()
      });
      alert("تم إرسال طلبك بنجاح!");
      document.getElementById("order-form").reset();
    } catch (err) {
      alert("خطأ: " + err.message);
    }
  });

  if (isAdmin) {
    const q = query(ordersCollection, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const listContainer = document.getElementById("orders-list");
      listContainer.innerHTML = "";
      if (snapshot.empty) {
        listContainer.innerHTML = "<p>لا توجد طلبات حالياً.</p>";
        return;
      }
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const itemDiv = document.createElement("div");
        itemDiv.className = "order-item";
        itemDiv.innerHTML = `
          <div><strong>الوجبة:</strong> ${data.item}</div>
          <div><strong>الزبون:</strong> ${data.customer} - ${data.phone}</div>
        `;
        listContainer.appendChild(itemDiv);
      });
    }, (error) => {
      console.error("Firestore Error:", error);
    });
  }
</script>

</body>
</html>
