<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truck Burger - المنيو وإدارة الوجبات</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1, h2 { text-align: center; color: #ffb703; }
    
    /* لوحة المالك */
    .admin-card { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #ffb703; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(255,183,3,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #ddd; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2b2b2b; color: #fff; box-sizing: border-box; font-size: 1rem; }
    .btn-add { background: #ffb703; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    .btn-add:hover { background: #e0a100; }

    /* عرض المنيو */
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
    .meal-card { background: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #333; text-align: center; padding-bottom: 15px; display: flex; flex-direction: column; justify: space-between; }
    .meal-card img { width: 100%; height: 160px; object-fit: cover; }
    .meal-title { font-size: 1.2rem; margin: 12px 0 5px 0; font-weight: bold; }
    .meal-price { color: #2ec4b6; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
    .btn-delete { background: #e63946; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin: 0 15px; }
    .btn-delete:hover { background: #c1121f; }
  </style>
</head>
<body>

<div class="container">
  <h1>Truck Burger 🍔</h1>

  <!-- لوحة المالك (تظهر فقط عند دخول رابط #admin) -->
  <div id="admin-panel" class="admin-card" style="display: none;">
    <h2>لوحة المالك: إضافة وجبة جديدة</h2>
    <form id="add-meal-form">
      <div class="form-group">
        <label>اسم الوجبة</label>
        <input type="text" id="meal-name" placeholder="مثال: برجر لحم دبل" required>
      </div>
      <div class="form-group">
        <label>السعر (ريال)</label>
        <input type="number" id="meal-price" placeholder="مثال: 2500" required>
      </div>
      <div class="form-group">
        <label>رابط صورة الوجبة</label>
        <input type="url" id="meal-image" placeholder="https://example.com/burger.jpg" required>
      </div>
      <button type="submit" class="btn-add">إضافة الوجبة للمنيو</button>
    </form>
  </div>

  <!-- قائمة العرض للزبائن -->
  <h2>قائمة الطعام</h2>
  <div class="menu-grid" id="menu-container">
    <p style="text-align:center;">جاري تحميل المنيو...</p>
  </div>
</div>

<!-- ربط Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // بيانات مشروعك الفعالية من الصورة
  const firebaseConfig = {
    apiKey: "AIzaSyBGCoYbgBZ4aRihP29_n",
    authDomain: "truck-burger-3d190.firebaseapp.com",
    projectId: "truck-burger-3d190",
    storageBucket: "truck-burger-3d190.appspot.com",
    messagingSenderId: "184670564449",
    appId: "1:184670564449:web:1cf68b2b9c2a4b9416ba20"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const mealsRef = collection(db, "menu");

  // إظهار لوحة التحكم إذا كان الرابط يحتوي على #admin
  const isAdmin = window.location.hash === "#admin";
  if (isAdmin) {
    document.getElementById("admin-panel").style.display = "block";
  }

  // 1. إضافة وجبة جديدة
  document.getElementById("add-meal-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("meal-name").value;
    const price = Number(document.getElementById("meal-price").value);
    const imageUrl = document.getElementById("meal-image").value;

    try {
      await addDoc(mealsRef, { name, price, imageUrl, createdAt: new Date() });
      document.getElementById("add-meal-form").reset();
      alert("تمت إضافة الوجبة بنجاح!");
    } catch (err) {
      alert("حدث خطأ أثناء الإضافة: " + err.message);
    }
  });

  // 2. جلب المنيو وعرضها تلقائياً
  onSnapshot(mealsRef, (snapshot) => {
    const container = document.getElementById("menu-container");
    container.innerHTML = "";

    if (snapshot.empty) {
      container.innerHTML = "<p style='text-align:center;'>لا توجد وجبات في المنيو حالياً.</p>";
      return;
    }

    snapshot.forEach((docSnap) => {
      const meal = docSnap.data();
      const id = docSnap.id;

      const card = document.createElement("div");
      card.className = "meal-card";
      card.innerHTML = `
        <img src="${meal.imageUrl}" alt="${meal.name}" onerror="this.src='https://via.placeholder.com/240x160?text=No+Image'">
        <div class="meal-title">${meal.name}</div>
        <div class="meal-price">${meal.price} ريال</div>
        ${isAdmin ? `<button class="btn-delete" onclick="deleteMeal('${id}')">حذف الوجبة</button>` : ''}
      `;
      container.appendChild(card);
    });
  });

  // 3. حذف الوجبة
  window.deleteMeal = async (id) => {
    if (confirm("هل تريد حذف هذه الوجبة نهائياً؟")) {
      await deleteDoc(doc(db, "menu", id));
    }
  };
</script>

</body>
</html>
